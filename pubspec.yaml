name: vidyalaya
description: "Vidyālaya. A book reading app for Indian school students."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.1
  google_fonts: ^8.0.2
  flutter_pdfview: ^1.3.2
  shared_preferences: ^2.5.0
  http: ^1.3.0
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/diagrams/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/square.png"
  remove_alpha_ios: true
  min_sdk_android: 21
