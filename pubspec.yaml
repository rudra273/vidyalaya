name: vidyalaya
description: "Vidyakalp. A book reading app for Indian school students."
publish_to: 'none'
version: 1.1.1+7

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.1
  google_fonts: ^8.0.2
  flutter_pdfview: ^1.3.2
  hive_ce: ^2.11.3
  hive_ce_flutter: ^2.3.1
  shared_preferences: ^2.5.0
  http: ^1.3.0
  uuid: ^4.5.3
  path_provider: ^2.1.0
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  google_sign_in: ^7.2.0
  webview_flutter: ^4.13.1
  flutter_markdown: ^0.7.7+1
  image_picker: ^1.1.2
  flutter_svg: ^2.3.0
  share_plus: ^12.0.1
  url_launcher: ^6.3.1
  in_app_update: ^4.2.5
  printing: ^5.15.1
  pdf: ^3.13.1
  flutter_math_fork: ^0.7.4
  markdown: ^7.3.1
  file_picker: ^11.0.3
  firebase_crashlytics: ^5.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/icons/
    - assets/diagrams/
    - assets/diagrams/interactive/
    - assets/avatars/
    - assets/data/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/vidyalaya.png"
  adaptive_icon_background: "#ECF1EC"
  adaptive_icon_foreground: "assets/icon/adaptive_foreground.png"
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: "assets/icon/monochrome.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/maskable.png"
    background_color: "#ECF1EC"
    theme_color: "#16855A"
  windows:
    generate: true
    image_path: "assets/icon/vidyalaya.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/vidyalaya.png"

flutter_native_splash:
  # Sage background matching the vector logo and app theme.
  color: "#ECF1EC"
  image: assets/icon/splash_mark.png
  android_12:
    # The text-free book/V fits the system's circular splash mask.
    image: assets/icon/splash_mark.png
    color: "#ECF1EC"
    icon_background_color: "#ECF1EC"
  android: true
  ios: true
