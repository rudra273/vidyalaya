name: vidyalaya
description: "Vidyālaya. A book reading app for Indian school students."
publish_to: 'none'
version: 1.1.0+4

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.1
  google_fonts: ^8.0.2
  flutter_pdfview: ^1.3.2
  hive_ce: ^2.11.3
  hive_ce_flutter: ^2.3.1
  shared_preferences: ^2.5.0
  http: ^1.3.0
  path_provider: ^2.1.0
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  google_sign_in: ^7.2.0
  webview_flutter: ^4.13.1
  flutter_markdown: ^0.7.7+1
  image_picker: ^1.1.2
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/diagrams/
    - assets/avatars/
    - assets/data/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/vidyalaya.png"
  remove_alpha_ios: true
  min_sdk_android: 21

flutter_native_splash:
  # White background matching the logo's white backdrop.
  color: "#FFFFFF"
  image: assets/icon/splash_mark.png
  android_12:
    # Android 12+ shows this icon inside the system's circular holder,
    # with the wordmark branding strip pinned at the bottom of the screen.
    image: assets/icon/splash_mark.png
    branding: assets/icon/branding.png
    color: "#FFFFFF"
    icon_background_color: "#FFFFFF"
  android: true
  ios: true
